<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>AR.js - Realidad Aumentada con Marcadores</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    #info {
      position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
      color: white; background: rgba(0,0,0,0.7); padding: 10px 20px;
      border-radius: 8px; font-family: sans-serif; font-size: 14px; z-index: 100;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="info">
    Apunte la cámara al marcador Hiro para ver el cubo 3D<br>
    <small>AR.js + A-Frame | Marcador: Hiro pattern</small>
  </div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    vr-mode-ui="enabled: false">

    <!-- Camera -->
    <a-entity camera></a-entity>

    <!-- Marker: Hiro pattern -->
    <a-marker preset="hiro">
      <!-- Rotating animated cube on marker -->
      <a-box
        position="0 0.5 0"
        rotation="0 45 0"
        color="#4af"
        material="opacity: 0.9; metalness: 0.3; roughness: 0.4"
        animation="property: rotation; to: 0 405 0; loop: true; dur: 3000; easing: linear"
        shadow>
      </a-box>
      <!-- Info text -->
      <a-text
        value="Visual Computing\nAR.js Demo"
        position="0 1.5 0"
        align="center"
        color="white"
        scale="0.7 0.7 0.7">
      </a-text>
      <!-- Floating sphere above -->
      <a-sphere
        position="0 2 0"
        radius="0.2"
        color="#f84"
        animation="property: position; to: 0 2.4 0; dir: alternate; loop: true; dur: 1500"
        material="emissive: #f84; emissiveIntensity: 0.3">
      </a-sphere>
    </a-marker>

  </a-scene>
</body>
</html>
